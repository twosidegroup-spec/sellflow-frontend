<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <p>Testing: <strong>https://sellflow-backend-0nyn.onrender.com/api/v1</strong></p>
    
    <button onclick="testStatus()">Test /status</button>
    <button onclick="testInfo()">Test /api/v1/info</button>
    <button onclick="testRegister()">Test /api/v1/auth/register</button>
    
    <div id="results"></div>

    <script>
        const baseUrl = 'https://sellflow-backend-0nyn.onrender.com';
        const results = document.getElementById('results');

        async function testStatus() {
            try {
                const res = await fetch(baseUrl + '/status');
                const data = await res.json();
                showResult('GET /status', data, res.ok);
            } catch (e) {
                showResult('GET /status', e.message, false);
            }
        }

        async function testInfo() {
            try {
                const res = await fetch(baseUrl + '/api/v1/info');
                const data = await res.json();
                showResult('GET /api/v1/info', data, res.ok);
            } catch (e) {
                showResult('GET /api/v1/info', e.message, false);
            }
        }

        async function testRegister() {
            try {
                const res = await fetch(baseUrl + '/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        full_name: 'Test User',
                        phone: '',
                        business_name: 'Test Business',
                        password: '1234'   // Backend expects 'password' not 'passcode'
                    })
                });
                const data = await res.text();
                showResult('POST /api/v1/auth/register', data, res.ok);
            } catch (e) {
                showResult('POST /api/v1/auth/register', e.message, false);
            }
        }

        function showResult(test, data, success) {
            const div = document.createElement('div');
            div.className = 'result ' + (success ? 'success' : 'error');
            div.innerHTML = `<strong>${test}:</strong> <pre>${JSON.stringify(data, null, 2)}</pre>`;
            results.appendChild(div);
        }

        // Auto-run tests on load
        window.onload = () => {
            testStatus();
            testInfo();
        };
    </script>
</body>
</html>
